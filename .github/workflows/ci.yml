name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-crosscheck.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests
      - name: Reproduce all results offline
        run: |
          cp -r results "$RUNNER_TEMP/committed_results"
          python -m firisk.run_all
      - name: Results match the committed versions (numeric tolerance 1e-8)
        run: python -m firisk.compare "$RUNNER_TEMP/committed_results" results
      - name: Documents match the committed versions exactly
        run: git diff --exit-code -- README.md ANALYSIS.md RESUME_BULLETS.md results/report_tokens.json
      - name: Tests (including QuantLib cross-check)
        run: pytest
